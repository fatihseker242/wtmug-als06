<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rapor - QR Yoklama</title>
<link rel="manifest" href="manifest.json">
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 12px; background: #f5f5f5; color: #222; }
  h1 { font-size: 18px; margin: 6px 0 12px; }
  .card { background: white; border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); overflow-x: auto; }
  label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; }
  select, button { font-size: 16px; padding: 10px; border-radius: 8px; border: 1px solid #ccc; width: 100%; }
  button { background: #607d8b; color: white; border: none; cursor: pointer; margin-top: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  th, td { border: 1px solid #e0e0e0; padding: 6px 4px; text-align: center; }
  th { background: #f0f0f0; position: sticky; top: 0; }
  td.name { text-align: left; font-size: 11px; min-width: 130px; }
  .yes { color: #2e7d32; font-weight: bold; }
  .no  { color: #c62828; }
  .total { font-weight: bold; background: #fafafa; }
</style>
</head>
<body>
<h1>📊 Yoklama Raporu</h1>

<div class="card">
  <label>Ders</label>
  <select id="courseSelect"><option>Yükleniyor...</option></select>
</div>

<div class="card" id="reportCard">
  <p style="color:#666">Lütfen bir ders seçin.</p>
</div>

<div class="card">
  <a href="index.html" style="text-decoration:none"><button>← Hoca Ekranına Dön</button></a>
</div>

<script>
const $ = (id) => document.getElementById(id);
const LS_ATT = 'attendance_v1';

let students = {};
let courses = [];

async function init() {
  const [sRes, cRes] = await Promise.all([
    fetch('students.json', { cache: 'no-store' }),
    fetch('courses.json', { cache: 'no-store' })
  ]);
  students = await sRes.json();
  courses = (await cRes.json()).courses || [];

  const sel = $('courseSelect');
  sel.innerHTML = courses.map(c =>
    `<option value="${c.id}">${c.name}</option>`
  ).join('');
  sel.onchange = render;
  render();
}

function loadAttendance() {
  try { return JSON.parse(localStorage.getItem(LS_ATT)) || {}; }
  catch { return {}; }
}

function render() {
  const courseId = $('courseSelect').value;
  const course = courses.find(c => c.id === courseId);
  if (!course) {
    $('reportCard').innerHTML = '<p style="color:#666">Ders bulunamadı.</p>';
    return;
  }
  const att = loadAttendance();
  const rows = course.students.map(sno => {
    const key = `${courseId}__${sno}`;
    const signed = new Set(att[key] || []);
    const student = students[sno] || { name: '?', surname: sno };
    const weekCells = [];
    for (let w = 1; w <= 14; w++) {
      weekCells.push(signed.has(w)
        ? '<td class="yes">✓</td>'
        : '<td class="no">✗</td>');
    }
    return `<tr>
      <td class="name"><strong>${sno}</strong><br>${student.name} ${student.surname}</td>
      ${weekCells.join('')}
      <td class="total">${signed.size}</td>
    </tr>`;
  }).join('');

  const header = ['<th>Öğrenci</th>'];
  for (let w = 1; w <= 14; w++) header.push(`<th>H${w}</th>`);
  header.push('<th>Toplam</th>');

  $('reportCard').innerHTML = `
    <h2 style="font-size:15px;margin:0 0 10px">${course.name} (${courseId})</h2>
    <table>
      <thead><tr>${header.join('')}</tr></thead>
      <tbody>${rows || '<tr><td colspan="16">Bu derste öğrenci yok.</td></tr>'}</tbody>
    </table>`;
}

init();
</script>
</body>
</html>
